[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxbot"
dynamic = ["version"]
description = "Minimal WeChat iLink text client"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<47",
  "httpx>=0.27,<1",
  "qrcode>=7.4,<9",
]

[project.scripts]
wxbot = "wxbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "wxbot.__version__"}
